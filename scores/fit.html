<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta http-equiv="Cache-Control" content="no-cache, must-revalidate">
<meta name="theme-color" content="#111111">
<title>Score</title>
<link rel="icon" href="../icon.svg" type="image/svg+xml">
<style>
:root{--top:0px;--bg:#141414;--bar:#1c1c1c;--fg:#f2efe8;--muted:#a8a29a;--accent:#c9a46a;--paper:#fffdf8}
*{box-sizing:border-box;touch-action:manipulation}
html,body{margin:0;height:100%;overflow:hidden;background:var(--paper);color:var(--fg);font:15px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-user-select:none;user-select:none}
#app{position:fixed;top:0;left:0;width:100vw;height:100vh;height:100dvh;overflow:hidden;background:var(--paper)}
#rotor{position:absolute;top:0;left:0;width:100%;height:100%;overflow:hidden;transform-origin:0 0}
#scroller{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;touch-action:pan-y}
body.pages #scroller{overflow:hidden}
#score{background:var(--paper);min-height:100%;padding-top:var(--top);transition:padding-top .25s ease,top .25s ease}
#score{position:relative}
#score svg{display:block;width:100%;height:auto}
#score svg.ink-layer{display:block}
body.pages #score svg{width:100%;height:100%}
#score{touch-action:pan-y}
#scroller,#scroller *{touch-action:pan-y}
body.pages #scroller,body.pages #scroller *{touch-action:none}
body.pages #score{touch-action:none}
body.pages #score{position:absolute;inset:0;top:var(--top);padding-top:0;min-height:0;overflow:hidden}
.zone{position:absolute;top:0;bottom:0;width:38%;z-index:2;cursor:pointer;display:none}
body.pages .zone{display:block}
#zl{left:0}#zr{right:0}
#bar{position:absolute;left:0;right:0;top:0;z-index:5;display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:8px 10px;padding-top:max(8px,env(safe-area-inset-top));background:var(--bar);backdrop-filter:blur(6px);transition:opacity .25s,transform .25s}
#bar.hide{opacity:0;transform:translateY(-100%);pointer-events:none}
@media (prefers-reduced-motion:reduce){#score,#bar{transition:none}}
#title{flex:1 1 140px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
button{font:inherit;color:var(--fg);background:#2a2a2a;border:1px solid #3a3a3a;border-radius:8px;padding:6px 10px;cursor:pointer;min-height:38px;min-width:38px}
button[aria-pressed="true"]{background:var(--accent);color:#1a1a1a;border-color:var(--accent)}
button:disabled{opacity:.4}
.seg{display:inline-flex}.seg button{border-radius:0}.seg button:first-child{border-radius:8px 0 0 8px}.seg button:last-child{border-radius:0 8px 8px 0}
#pg{min-width:52px;text-align:center;color:var(--muted)}
body:not(.pages) .ponly{display:none}
#msg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;color:#555;z-index:1;background:var(--paper)}
#msg a{color:#8a6a2a}
#cd{position:absolute;inset:0;z-index:3;display:flex;align-items:center;justify-content:center;font:600 min(40vw,40vh)/1 system-ui,sans-serif;color:rgba(40,40,40,.28);pointer-events:none}
#cd[hidden]{display:none}
#menuBtn{position:absolute;right:max(14px,env(safe-area-inset-right));top:max(14px,env(safe-area-inset-top));z-index:4;width:44px;height:44px;min-width:44px;padding:0;border-radius:12px;border:0;background:rgba(40,40,40,.72);color:#fff;font-size:20px;line-height:44px;backdrop-filter:blur(6px)}
#trPanel{position:absolute;inset:0;z-index:8;display:flex;align-items:flex-start;justify-content:center;padding:max(70px,env(safe-area-inset-top)) 12px 12px;background:rgba(0,0,0,.25)}
#trPanel[hidden]{display:none}
.trbox{background:#1c1c1c;border-radius:16px;padding:16px;width:min(420px,100%);box-shadow:0 14px 40px rgba(0,0,0,.4);display:flex;flex-direction:column;gap:12px}
.trbox h4{margin:0;font-size:17px}
.trbox label{display:flex;flex-direction:column;gap:6px;color:var(--muted);font-size:13px}
.trbox select{font:inherit;font-size:16px;color:var(--fg);background:#2a2a2a;border:1px solid #3a3a3a;border-radius:10px;padding:10px}
.trrow{display:flex;align-items:center;gap:8px}
.trrow>span{flex:0 0 64px;color:var(--muted);font-size:13px}
.trrow b{flex:1;text-align:center;font-weight:600}
.trrow button{min-width:44px;min-height:44px;font-size:18px}
.trnote{color:var(--muted);font-size:12.5px;margin:0}
.trfoot{display:flex;gap:8px;justify-content:flex-end}
.trfoot button{font-size:15px}
#trDone{background:var(--accent);color:#1a1a1a;border-color:var(--accent);font-weight:600}
@media (max-width:520px){.lbl{display:none}}
</style>
</head>
<body class="pages">
<div id="app">
<div id="msg">Loading the score…</div>
<div id="trPanel" hidden><div class="trbox" role="dialog" aria-label="Transpose">
  <h4>Transpose</h4>
  <label>Playing it on <select id="trInst"></select></label>
  <div class="trrow"><span>Key</span><button type="button" id="trDn" aria-label="Down a semitone">−</button><b id="trKey">C major</b><button type="button" id="trUp" aria-label="Up a semitone">+</button></div>
  <div class="trrow"><span>Octave</span><button type="button" id="trOd" aria-label="Octave down">−</button><b id="trOct">Auto</b><button type="button" id="trOu" aria-label="Octave up">+</button></div>
  <p class="trnote" id="trNote"></p>
  <div class="trfoot"><button type="button" id="trReset">Reset</button><button type="button" id="trDone">Done</button></div>
</div></div>
<div id="rotor"><div id="scroller"><div id="score"></div></div>
<div id="cd" hidden aria-live="assertive"></div>
<div class="zone" id="zl" aria-hidden="true"></div>
<div class="zone" id="zr" aria-hidden="true"></div></div>
<div id="bar">
  <a href="./" style="text-decoration:none"><button type="button" title="Back to the library">←</button></a>
  <div id="title">Score</div><span id="ver" style="color:var(--muted);font-size:12px">v13</span>
  <div class="seg" role="group" aria-label="Layout">
    <button type="button" data-view="pages" title="Turn pages (tap or pedal)">Pages</button>
    <button type="button" data-view="scroll" title="One long scrolling page">Scroll</button>
  </div>
  <div class="seg" role="group" aria-label="Size">
    <button type="button" id="zout" title="Smaller (−)">A−</button>
    <button type="button" id="zin" title="Bigger (+)">A+</button>
    <button type="button" id="all" title="Shrink until the whole score fits on one screen">Fit all</button>
  </div>
  <button type="button" id="gap" title="Space between lines (G)">↕<span class="lbl" id="gapLbl"> Normal</span></button>
  <button type="button" id="hsp" title="Space between notes (H)">↔<span class="lbl" id="hspLbl"> Normal</span></button>
  <button type="button" id="prev" class="ponly" title="Previous (← / Page Up)">‹</button>
  <span id="pg" class="ponly">–</span>
  <button type="button" id="next" class="ponly" title="Next (→ / Page Down / space)">›</button>
  <div class="seg" role="group" aria-label="Auto-scroll">
    <button type="button" id="play" title="Scroll down by itself (P)">▶<span class="lbl"> Play</span></button>
    <button type="button" id="slow" title="Slower">−</button>
    <span id="spd" style="padding:0 8px;color:var(--muted);align-self:center">1</span>
    <button type="button" id="fast" title="Faster">+</button>
  </div>
  <button type="button" id="cdBtn" title="Countdown before Play">⏱<span class="lbl" id="cdLbl"> 3 s</span></button>
  <button type="button" id="rep" title="Repeats: written out in order (continuous) or as printed" hidden>→<span class="lbl" id="repLbl"> Continuous</span></button>
  <button type="button" id="trBtn" title="Transpose for another instrument or key (T)" hidden>♯<span class="lbl" id="trLbl"> Transpose</span></button>
  <button type="button" id="inkBtn" title="Draw on the score (D)">✎<span class="lbl"> Draw</span></button>
  <button type="button" id="rot" title="Rotate the score (R) — for a monitor standing upright that doesn't rotate by itself">⟳<span class="lbl" id="rotLbl"> Upright</span></button>
  <button type="button" id="fs" title="Full screen (F)">⛶<span class="lbl"> Full screen</span></button>
</div>
<button type="button" id="menuBtn" title="Menu" aria-label="Show menu">☰</button>
</div>

<script src="ink.js"></script>
<script>
const API_KEY="AIzaSyBBSNHHAweVUTKnF_R7UlKpH9bhgyLypIo";
const $=s=>document.querySelector(s);
const P=new URLSearchParams(location.search);
const xid=P.get("x"), uid=P.get("u"), usrc=P.get("usrc"), src=P.get("src"), title=P.get("t")||"Score", pdf=P.get("id"), vk=P.get("k"), lid=P.get("l");
document.title=title; $("#title").textContent=title;
let tk=null, page=1, pages=1, view=localStorage.getItem("fit-view")||"pages";
let zoom=+(localStorage.getItem("fit-zoom")||0);
const GAPS=[["Normal",8,30],["Compact",3,12],["Tight",0,4]];   // name, verovio spacingSystem, page margins
let gap=+(localStorage.getItem("fit-gap")||0)%GAPS.length;
const HSP=[["Normal",0.25,0.6],["Compact",0.17,0.5],["Tight",0.11,0.42]];   // name, spacingLinear, spacingNonLinear (lower = long notes take less room)
let hsp=+(localStorage.getItem("fit-hsp")||0)%HSP.length;   // user offset from the automatic size
const ROTS=[[0,"Upright"],[90,"Turned ↻"],[270,"Turned ↺"]];
let rot=+(localStorage.getItem("fit-rot")||0)%ROTS.length;
/* screen size that browser zoom can't distort: layout width + visible height at zoom 1 */
const SW=()=>document.documentElement.clientWidth||innerWidth, SH=()=>Math.round(window.visualViewport?visualViewport.height*visualViewport.scale:innerHeight);
const VW=()=>ROTS[rot][0]?SH():SW(), VH=()=>ROTS[rot][0]?SW():SH();
function applyRot(){ const a=$("#rotor"), d=ROTS[rot][0];
  $("#app").style.width=SW()+"px"; $("#app").style.height=SH()+"px";
  a.style.width=VW()+"px"; a.style.height=VH()+"px";
  a.style.transform=d===90?`translateX(${SW()}px) rotate(90deg)`:d===270?`translateY(${SH()}px) rotate(-90deg)`:"none";
  $("#rotLbl").textContent=" "+ROTS[rot][1]; }
function setRot(r){ rot=r%ROTS.length; try{localStorage.setItem("fit-rot",rot)}catch(e){} applyRot(); layout(true); barSpace(); }
/* auto-scroll */
const SPEEDS=[6,9,13,18,24,32,42,55,72,95];   // pixels per second
let spd=+(localStorage.getItem("fit-spd")||3), playing=false, lastT=0, acc=0;
function showSpd(){ $("#spd").textContent=spd+1; }
function tick(t){ if(!playing) return; const sc=$("#scroller");
  if(lastT){ acc+=SPEEDS[spd]*(t-lastT)/1000; const n=Math.floor(acc); if(n){ sc.scrollTop+=n; acc-=n; } }
  lastT=t;
  if(sc.scrollTop+sc.clientHeight>=sc.scrollHeight-1){ stopPlay(); return; }
  requestAnimationFrame(tick); }
/* countdown before Play, to pick up the instrument */
const DELAYS=[0,2,3,5];
let cdi=+(localStorage.getItem("fit-cd")??2)%DELAYS.length, counting=null;
function showCd(){ $("#cdLbl").textContent=" "+DELAYS[cdi]+" s"; $("#cdBtn").title="Countdown before Play: "+(DELAYS[cdi]?DELAYS[cdi]+" seconds":"off"); }
function setCd(i){ cdi=i%DELAYS.length; try{localStorage.setItem("fit-cd",cdi)}catch(e){} showCd(); }
function startPlay(){ if(!tk||playing||counting) return; if(view!=="scroll") setView("scroll");
  $("#play").innerHTML='❚❚<span class="lbl"> Pause</span>'; $("#play").setAttribute("aria-pressed","true"); $("#bar").classList.add("hide");
  let n=DELAYS[cdi]; if(!n) return beginPlay();
  const o=$("#cd"); o.hidden=false; o.textContent=n;
  counting=setInterval(()=>{ n--; if(n>0){ o.textContent=n; return; } clearInterval(counting); counting=null; o.hidden=true; beginPlay(); },1000); }
function beginPlay(){ playing=true; lastT=0; acc=0; $("#play").innerHTML='❚❚<span class="lbl"> Pause</span>'; $("#play").setAttribute("aria-pressed","true"); $("#bar").classList.add("hide"); requestAnimationFrame(tick); }
function stopPlay(){ if(counting){ clearInterval(counting); counting=null; $("#cd").hidden=true; } playing=false; $("#play").innerHTML='▶<span class="lbl"> Play</span>'; $("#play").setAttribute("aria-pressed","false"); }
function setSpd(v){ spd=Math.max(0,Math.min(SPEEDS.length-1,v)); try{localStorage.setItem("fit-spd",spd)}catch(e){} showSpd(); }
function autoScale(){ return Math.round(Math.max(24,Math.min(60,VW()/14,VH()/12))); }
function scale(){ return Math.max(18,Math.min(90,autoScale()+zoom)); }
function layout(keepRatio){
  if(!tk) return; applyRot();
  const ratio=pages>1?(page-1)/(pages-1):0, s=scale(), k=100/s;
  const opts={scale:s,pageWidth:Math.round(VW()*k),pageMarginLeft:40,pageMarginRight:40,pageMarginTop:view==="pages"?Math.max(GAPS[gap][2],20)+20:GAPS[gap][2],pageMarginBottom:GAPS[gap][2],
    breaks:"auto",footer:"none",header:"auto",spacingSystem:GAPS[gap][1],spacingLinear:HSP[hsp][1],spacingNonLinear:HSP[hsp][2],spacingStaff:4,svgViewBox:true,svgRemoveXlink:true};
  if(view==="pages"){ opts.pageHeight=Math.round(VH()*k); opts.adjustPageHeight=false; }
  else { opts.pageHeight=60000; opts.adjustPageHeight=true; }
  tk.setOptions(opts); tk.redoLayout();
  pages=tk.getPageCount();
  page=keepRatio?Math.max(1,Math.min(pages,1+Math.round(ratio*(pages-1)))):Math.min(page,pages);
  draw();
}
/* ---------- transpose: instrument (written key, clef, range), semitones, octave ---------- */
/* id, name, written minus sounding (semitones), clef, comfortable written range (MIDI) */
const INST=[["asis","As written",0,null,0,127],["vn","Violin",0,"G2",55,100],["va","Viola",0,"C3",48,88],["vc","Cello",0,"F4",36,81],["db","Double bass",12,"F4",40,79],
  ["fl","Flute",0,"G2",60,96],["ob","Oboe",0,"G2",58,93],["cl","Clarinet in B♭",2,"G2",52,96],["tp","Trumpet in B♭",2,"G2",54,86],["as","Alto sax (E♭)",9,"G2",58,89],["ts","Tenor sax (B♭)",14,"G2",58,89],
  ["hn","Horn in F",7,"G2",54,84],["tb","Trombone",0,"F4",40,77],["gt","Guitar",12,"G2",52,95],["pr","Piano, right hand",0,"G2",55,96],["pl","Piano, left hand",0,"F4",28,64],
  ["sop","Soprano",0,"G2",60,84],["mez","Mezzo-soprano",0,"G2",57,81],["alt","Alto (voice)",0,"G2",53,77],["ten","Tenor (voice)",12,"G2-8",60,84],["bar","Baritone",0,"F4",43,67],["bas","Bass (voice)",0,"F4",40,64]];
const CLEF={G2:"<clef><sign>G</sign><line>2</line></clef>","G2-8":"<clef><sign>G</sign><line>2</line><clef-octave-change>-1</clef-octave-change></clef>",C3:"<clef><sign>C</sign><line>3</line></clef>",F4:"<clef><sign>F</sign><line>4</line></clef>"};
const IV={0:[["P",1,0]],1:[["m",2,-5],["A",1,7]],2:[["M",2,2]],3:[["m",3,-3],["A",2,9]],4:[["M",3,4]],5:[["P",4,-1]],6:[["A",4,6],["d",5,-6]],7:[["P",5,1]],8:[["m",6,-4],["A",5,8]],9:[["M",6,3]],10:[["m",7,-2]],11:[["M",7,5]]};
const MAJ=["C♭","G♭","D♭","A♭","E♭","B♭","F","C","G","D","A","E","B","F♯","C♯"], MIN=["A♭","E♭","B♭","F","C","G","D","A","E","B","F♯","C♯","G♯","D♯","A♯"];
let XOs=null, XUs=null, f0=0, minor=false, pitches=[], trKey="", TR={semi:0,oct:null}, inst=localStorage.getItem("tr-inst")||"asis";
const I=()=>INST.find(x=>x[0]===inst)||INST[0];
function spell(T){ if(!T) return {s:"",f:f0}; const dn=T<0, a=Math.abs(T), oc=Math.floor(a/12); let best=null;
  for(const [q,n,d] of IV[a%12]){ const f=f0+(dn?-d:d); if(!best||Math.abs(f)<Math.abs(best.f)) best={q,n,f}; }
  return {s:(dn?"-":"")+best.q+(best.n+7*oc), f:best.f}; }
function autoOct(base){ const [,,,clef,lo,hi]=I(); if(!clef||!pitches.length) return 0; let best=0, bs=-1, bc=1e9;
  for(let k=-3;k<=3;k++){ let n=0, sum=0; for(const p of pitches){ const w=p+base+12*k; if(w>=lo&&w<=hi) n++; sum+=w; } const c=Math.abs(sum/pitches.length-(lo+hi)/2);
    if(n>bs||(n===bs&&c<bc)){ best=k; bs=n; bc=c; } } return best; }
function trState(){ const it=I(), base=it[2]+TR.semi, ao=autoOct(base), oct=TR.oct===null?ao:TR.oct, sp=spell(base+12*oct); return {it,base,ao,oct,sp}; }
function trPrep(){ /* set the engine options and the (re-clefed) MusicXML for the current choice */
  if(!tk) return; const {it,sp}=trState();
  const nm=it[1].replace(/ \(.*\)|, .*/,"").replace(/&/g,"&amp;").replace(/</g,"&lt;");
  const clefify=x=>!x||!it[3]||/<staves>\s*[2-9]/.test(x)?x:x.replace(/<clef\b[^>]*>[\s\S]*?<\/clef>/g,CLEF[it[3]]).replace(/<part-name([^>]*)>[\s\S]*?<\/part-name>/,`<part-name$1>${nm}</part-name>`);
  tk.setOptions({transpose:sp.s}); if(!ZIP){ XO=clefify(XOs); XU=XUs?clefify(XUs):null; } loaded=null; trUI(); }
function trApply(){ trPrep(); loadFor(view); layout(true); }
function trUI(){ const {it,ao,oct,sp}=trState(); const names=minor?MIN:MAJ, kn=Math.abs(sp.f)<=7?names[sp.f+7]+(minor?" minor":" major"):"";
  $("#trKey").textContent=(kn||"Key")+(TR.semi?` (${TR.semi>0?"+":""}${TR.semi})`:"");
  $("#trOct").textContent=TR.oct===null?(it[3]?`Auto (${ao>0?"+":""}${ao})`:"As written"):`${oct>0?"+":""}${oct}`;
  $("#trNote").textContent=it[0]==="asis"?"":`Written for ${it[1].toLowerCase()}${it[2]?" (transposing instrument)":""}, ${it[3]==="F4"?"bass clef":it[3]==="C3"?"alto clef":it[3]==="G2-8"?"tenor (octave) clef":"treble clef"}, octave chosen to fit its range.`;
  const changed=it[0]!=="asis"||TR.semi||TR.oct; $("#trLbl").textContent=" "+(changed?(it[0]!=="asis"?it[1].replace(/ \(.*\)| in .*|,.*/,""):"")+(TR.semi?(it[0]!=="asis"?" ":"")+(TR.semi>0?"+":"")+TR.semi:""):"Transpose");
  $("#trBtn").setAttribute("aria-pressed",!!changed); }
function trSave(){ try{ localStorage.setItem("tr:"+trKey,JSON.stringify(TR)); localStorage.setItem("tr-inst",inst); }catch(e){} if(window.Vault){ Vault.note("tr:"+trKey); Vault.note("tr-inst"); } }
addEventListener("vault-sync",e=>{ if(!trKey||!(e.detail.includes("tr:"+trKey)||e.detail.includes("tr-inst"))) return;
  try{ TR=Object.assign({semi:0,oct:null},JSON.parse(localStorage.getItem("tr:"+trKey)||"{}")); }catch(_){} inst=localStorage.getItem("tr-inst")||"asis"; $("#trInst").value=inst; trApply(); });
function trInit(key,xml){ trKey=key; try{ TR=Object.assign({semi:0,oct:null},JSON.parse(localStorage.getItem("tr:"+key)||"{}")); }catch(e){}
  if(xml){ const m=xml.match(/<fifths>\s*(-?\d+)\s*<\/fifths>/); f0=m?+m[1]:0; minor=/<mode>\s*minor\s*<\/mode>/.test(xml);
    const ST={C:0,D:2,E:4,F:5,G:7,A:9,B:11}; pitches=[]; const re=/<pitch>\s*<step>([A-G])<\/step>\s*(?:<alter>\s*(-?[\d.]+)\s*<\/alter>\s*)?<octave>(\d)<\/octave>/g; let r;
    while((r=re.exec(xml))) pitches.push(12*(+r[3]+1)+ST[r[1]]+Math.round(+(r[2]||0))); }
  $("#trInst").innerHTML=INST.map(([id,n])=>`<option value="${id}"${id===inst?" selected":""}>${n}</option>`).join("");
  $("#trBtn").hidden=false; }
$("#trBtn").onclick=()=>{ stopPlay(); trUI(); $("#trPanel").hidden=false; clearTimeout(hideT); };
$("#trDone").onclick=()=>{ $("#trPanel").hidden=true; showBar(); };
$("#trPanel").addEventListener("click",e=>{ if(e.target.id==="trPanel"){ $("#trPanel").hidden=true; showBar(); } });
$("#trInst").onchange=e=>{ inst=e.target.value; TR.oct=null; trSave(); trApply(); };
$("#trUp").onclick=()=>{ TR.semi=Math.min(11,TR.semi+1); trSave(); trApply(); };
$("#trDn").onclick=()=>{ TR.semi=Math.max(-11,TR.semi-1); trSave(); trApply(); };
$("#trOu").onclick=()=>{ TR.oct=Math.min(3,trState().oct+1); trSave(); trApply(); };
$("#trOd").onclick=()=>{ TR.oct=Math.max(-3,trState().oct-1); trSave(); trApply(); };
$("#trReset").onclick=()=>{ inst="asis"; TR={semi:0,oct:null}; $("#trInst").value="asis"; trSave(); trApply(); };

/* ---------- annotations: drawings attached to bars ---------- */
let ink=null, barN={};
function toLocal(X,Y){ const d=ROTS[rot][0]; let x=X,y=Y; if(d===90){x=Y;y=SW()-X;} else if(d===270){x=SH()-Y;y=X;}
  const sc=$("#score"), sr=$("#scroller"); return {x:x-sc.offsetLeft, y:y-(sc.offsetTop-sr.scrollTop)}; }
function rectLocal(el){ const r=el.getBoundingClientRect(), a=toLocal(r.left,r.top), b=toLocal(r.right,r.bottom);
  return {x:Math.min(a.x,b.x), y:Math.min(a.y,b.y), w:Math.abs(b.x-a.x), h:Math.abs(b.y-a.y)}; }
function barFrames(){ const out=[];
  document.querySelectorAll("#score g.measure").forEach(m=>{
    let n=barN[m.id]; if(n===undefined){ try{ n=barN[m.id]=(tk.getElementAttr(m.id)||{}).n||m.id; }catch(e){ n=barN[m.id]=m.id; } }
    const st=m.querySelector("g.staff"); if(!st) return; const ls=st.querySelectorAll(":scope > path"); if(ls.length<2) return;
    const a=rectLocal(ls[0]), b=rectLocal(ls[ls.length-1]); const x=Math.min(a.x,b.x), w=Math.max(a.x+a.w,b.x+b.w)-x, y=a.y+a.h/2, h=(b.y+b.h/2)-y;
    if(w>4&&h>4) out.push({key:String(n),x,y,w,h,unit:h});
  }); return out; }
function inkRender(){ if(ink) ink.render(); }
function setupInk(store){
  ink=Ink.create({container:$("#score"),captureParent:$("#rotor"),store,mode:"bar",frames:barFrames,toLocal,
    hint:"Tap a bar, then draw. Two fingers scroll.",panBy:dy=>{ $("#scroller").scrollTop+=dy; inkRender(); },
    onEnter:()=>{ stopPlay(); clearTimeout(hideT); $("#bar").classList.add("hide"); $("#menuBtn").hidden=true; $("#inkBtn").setAttribute("aria-pressed","true"); },
    onExit:()=>{ $("#menuBtn").hidden=false; $("#inkBtn").setAttribute("aria-pressed","false"); showBar(); }});
  $("#inkBtn").onclick=()=>ink.active?ink.exit():ink.enter();
  $("#score").addEventListener("transitionend",inkRender); $("#scroller").addEventListener("scroll",()=>{ if(ink&&ink.active) inkRender(); },{passive:true});
}
function draw(){
  if(view==="pages"){ $("#score").innerHTML=tk.renderToSVG(page); $("#pg").textContent=page+" / "+pages; $("#prev").disabled=page<=1; $("#next").disabled=page>=pages; }
  else { let h=""; for(let i=1;i<=pages;i++) h+=tk.renderToSVG(i); $("#score").innerHTML=h; }
  if(ink) $("#score").appendChild(ink.layer);
  requestAnimationFrame(inkRender);
}
function go(d){ if(view!=="pages"||!tk) return; const n=page+d; if(n<1||n>pages) return; page=n; draw(); }
function setView(v){ view=v; if(tk) loadFor(v); try{localStorage.setItem("fit-view",v)}catch(e){} document.body.classList.toggle("pages",v==="pages");
  document.querySelectorAll("[data-view]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.view===v)); page=1; layout(false); $("#scroller").scrollTop=0; }
function setGap(g){ gap=g%GAPS.length; try{localStorage.setItem("fit-gap",gap)}catch(e){} $("#gapLbl").textContent=" "+GAPS[gap][0]; $("#gap").title="Space between lines: "+GAPS[gap][0]+" (G)"; layout(true); }
$("#gap").onclick=()=>setGap(gap+1);
function setHsp(h){ hsp=h%HSP.length; try{localStorage.setItem("fit-hsp",hsp)}catch(e){} $("#hspLbl").textContent=" "+HSP[hsp][0]; $("#hsp").title="Space between notes: "+HSP[hsp][0]+" (H)"; layout(true); }
$("#hsp").onclick=()=>setHsp(hsp+1);
$("#rot").onclick=()=>setRot(rot+1);
function showRep(){ $("#repLbl").textContent=cont?" Continuous":" Repeats as printed"; $("#rep").firstChild.textContent=cont?"→":"↺"; $("#rep").setAttribute("aria-pressed",cont); }
$("#rep").onclick=()=>{ cont=!cont; try{localStorage.setItem("fit-cont",cont?"1":"0")}catch(e){} showRep(); if(tk){ loadFor(view); page=1; layout(false); $("#scroller").scrollTop=0; } };
$("#play").onclick=()=>(playing||counting)?stopPlay():startPlay(); $("#cdBtn").onclick=()=>setCd(cdi+1); $("#slow").onclick=()=>setSpd(spd-1); $("#fast").onclick=()=>setSpd(spd+1);
function fitAll(){ // biggest size at which the whole piece fits one screen
  if(!tk) return; if(view!=="pages") setView("pages");
  for(let z=zoom; scale()>18; z-=2){ zoom=z; layout(false); if(pages===1) break; }
  try{localStorage.setItem("fit-zoom",zoom)}catch(e){}
}
$("#all").onclick=fitAll;
function setZoom(d){ zoom+=d; try{localStorage.setItem("fit-zoom",zoom)}catch(e){} layout(true); }
document.querySelectorAll("[data-view]").forEach(b=>b.addEventListener("click",()=>setView(b.dataset.view)));
$("#zin").onclick=()=>setZoom(+4); $("#zout").onclick=()=>setZoom(-4);
$("#prev").onclick=()=>go(-1); $("#next").onclick=()=>go(1);
$("#zl").onclick=()=>go(-1); $("#zr").onclick=()=>go(1);
let hideT; function showBar(){ $("#bar").classList.remove("hide"); clearTimeout(hideT); hideT=setTimeout(()=>$("#bar").classList.add("hide"),4000); }
$("#menuBtn").onclick=showBar; $("#score").addEventListener("click",()=>{ if(playing||counting){ stopPlay(); showBar(); return; } ($("#bar").classList.contains("hide")?showBar():$("#bar").classList.add("hide")); });
$("#bar").addEventListener("pointerdown",showBar);
addEventListener("keydown",e=>{
  const k=e.key;
  if(view==="pages"){
    if(["ArrowRight","PageDown"," ","ArrowDown","Enter"].includes(k)){e.preventDefault();go(1);return}
    if(["ArrowLeft","PageUp","ArrowUp","Backspace"].includes(k)){e.preventDefault();go(-1);return}
  } else if(k==="PageDown"||k===" "){ e.preventDefault(); $("#scroller").scrollBy({top:VH()*0.85,behavior:"smooth"}); return; }
  else if(k==="PageUp"){ e.preventDefault(); $("#scroller").scrollBy({top:-VH()*0.85,behavior:"smooth"}); return; }
  if(k==="+"||k==="=") setZoom(4); else if(k==="-") setZoom(-4); else if(k==="f"||k==="F") toggleFs(); else if(k==="g"||k==="G") setGap(gap+1); else if(k==="h"||k==="H") setHsp(hsp+1); else if(k==="r"||k==="R") setRot(rot+1); else if((k==="t"||k==="T")&&tk) $("#trBtn").click(); else if((k==="d"||k==="D")&&ink) ink.active?ink.exit():ink.enter(); else if(k==="p"||k==="P") (playing||counting)?stopPlay():startPlay();
});
const along=t=>{ const d=ROTS[rot][0]; return d===90?t.clientY:d===270?-t.clientY:t.clientX; };
let sx=null; addEventListener("touchstart",e=>{ if(ink&&ink.active){ sx=null; return; } sx=e.touches.length===1?along(e.touches[0]):null; },{passive:true});
addEventListener("touchend",e=>{ if(sx===null) return; const dx=along(e.changedTouches[0])-sx; sx=null; if(Math.abs(dx)>60) go(dx<0?1:-1); },{passive:true});
let rT, lastW=innerWidth, lastH=innerHeight;
addEventListener("resize",()=>{ clearTimeout(rT); rT=setTimeout(()=>{ if(Math.abs(innerWidth-lastW)<4&&Math.abs(innerHeight-lastH)<60&&view==="scroll") return; lastW=innerWidth; lastH=innerHeight; layout(true); },200); });
async function toggleFs(){ const el=document.documentElement; try{ if(!document.fullscreenElement) await (el.requestFullscreen||el.webkitRequestFullscreen).call(el); else await document.exitFullscreen(); }catch(e){} }
$("#fs").onclick=toggleFs;
function relayoutSoon(){ [60,300,800].forEach(t=>setTimeout(()=>{ lastW=innerWidth; lastH=innerHeight; layout(true); },t)); }
document.addEventListener("fullscreenchange",relayoutSoon); document.addEventListener("webkitfullscreenchange",relayoutSoon);
if(window.visualViewport) visualViewport.addEventListener("resize",()=>{ clearTimeout(rT); rT=setTimeout(()=>layout(true),250); });
/* pinch = A- / A+ (instead of browser zoom, which on iPad also exits full screen) */
let pinch0=null;
addEventListener("touchstart",e=>{ if(e.touches.length===2){ const [a,b]=e.touches; pinch0=Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY); } },{passive:true});
addEventListener("touchmove",e=>{ if(e.touches.length>=2) e.preventDefault(); },{passive:false});
addEventListener("touchend",e=>{ if(pinch0&&e.touches.length<2){ const t=e.changedTouches[0], o=e.touches[0]; pinch0=null; } },{passive:true});
let lastPinch=1;
addEventListener("touchmove",e=>{ if(pinch0&&e.touches.length===2){ const [a,b]=e.touches; lastPinch=Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY)/pinch0; } },{passive:true});
addEventListener("touchend",e=>{ if(ink&&ink.active){ lastPinch=1; return; } if(e.touches.length===0&&lastPinch!==1){ const r=lastPinch; lastPinch=1; if(r>1.12) setZoom(Math.min(16,Math.round((r-1)*12))); else if(r<0.88) setZoom(-Math.min(16,Math.round((1-r)*12))); } },{passive:true});
let lastTap=0;
document.addEventListener("touchend",e=>{ if(ink&&ink.active) return; if(e.touches.length||e.changedTouches.length!==1) return; const now=Date.now();
  if(now-lastTap<350){ e.preventDefault(); const t=e.changedTouches[0], el=document.elementFromPoint(t.clientX,t.clientY); if(el) el.dispatchEvent(new MouseEvent("click",{bubbles:true,clientX:t.clientX,clientY:t.clientY})); }
  lastTap=now; },{passive:false});
document.addEventListener("dblclick",e=>e.preventDefault(),{passive:false});
["gesturestart","gesturechange","gestureend"].forEach(n=>document.addEventListener(n,e=>e.preventDefault(),{passive:false}));
let lock=null; async function wake(){ try{ lock=await navigator.wakeLock.request("screen"); }catch(e){} }
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible") wake(); });

/* print-only layout and repeated instrument names removed; "unrolled" version (repeats written out) used for Scroll / Play */
let XO=null, XU=null, loaded=null;
function clean(x){ return x.replace(/<credit[\s\S]*?<\/credit>/g,"").replace(/<page-layout>[\s\S]*?<\/page-layout>/g,"").replace(/<system-layout>[\s\S]*?<\/system-layout>/g,"").replace(/<staff-layout[\s\S]*?<\/staff-layout>/g,"").replace(/<print[^>]*\/>/g,"").replace(/<print[\s\S]*?<\/print>/g,"").replace(/<part-abbreviation[^>]*>[\s\S]*?<\/part-abbreviation>/g,"").replace(/<part-abbreviation-display>[\s\S]*?<\/part-abbreviation-display>/g,""); }
let cont=(localStorage.getItem("fit-cont")||"1")==="1";
let ZIP=null;
function loadFor(v){ barN={}; if(ZIP){ if(loaded==="z") return true; loaded="z"; return tk.loadZipDataBuffer(ZIP); } const want=(cont&&XU)?"u":"o"; if(loaded===want) return true; loaded=want; return tk.loadData(want==="u"?XU:XO); }
function fail(){ $("#msg").innerHTML="This score couldn't be shown here."+(pdf?`<br><br><a href="view.html?id=${encodeURIComponent(pdf)}&t=${encodeURIComponent(title)}">Open the PDF instead</a>`:""); }
function barSpace(){ const b=$("#bar"), h=(!b.classList.contains("hide")&&ROTS[rot][0]===0)?b.offsetHeight:0;
  document.documentElement.style.setProperty("--top",h+"px"); }
new MutationObserver(barSpace).observe($("#bar"),{attributes:true,attributeFilter:["class"]});
addEventListener("resize",()=>setTimeout(barSpace,50));
applyRot();
async function start(){
  let xml;
  if(vk){ /* encrypted library (vault) */
    try{ xml=await Vault.text("x-"+vk); }
    catch(e){ $("#msg").innerHTML=e.message==="locked"?'This score is locked.<br><br><a href="./">Sign in on the library page</a>':"This score isn't available yet."+(pdf?`<br><br><a href="view.html?id=${encodeURIComponent(pdf)}&t=${encodeURIComponent(title)}">Open the PDF instead</a>`:""); return; }
    try{ XU=clean(await Vault.text("u-"+vk)); }catch(e){}
  } else if(lid){ /* imported on this device */
    const rec=await Vault.localGet(lid).catch(()=>null);
    if(!rec){ $("#msg").innerHTML='This score is no longer on this device.<br><br><a href="./">Back to the library</a>'; return; }
    if(rec.type==="mxl") ZIP=rec.data; else xml=new TextDecoder().decode(rec.data);
  } else {
    const url=src||(xid?`https://www.googleapis.com/drive/v3/files/${encodeURIComponent(xid)}?alt=media&key=${API_KEY}`:null);
    if(!url){ $("#msg").textContent="No score selected."; return; }
    try{ const r=await fetch(url); if(!r.ok) throw 0; xml=await r.text(); }catch(e){ return fail(); }
    const uurl=usrc||(uid?`https://www.googleapis.com/drive/v3/files/${encodeURIComponent(uid)}?alt=media&key=${API_KEY}`:null);
    if(uurl){ try{ const r=await fetch(uurl); if(r.ok) XU=clean(await r.text()); }catch(e){} }
  }
  try{
    tk=new verovio.toolkit();
    tk.setOptions({scale:scale(),breaks:"auto"});
    if(!ZIP) XO=clean(xml); loaded=null;
    XOs=XO; XUs=XU; trInit(vk||(lid?"l:"+lid:"")||xid||src||title, XOs); trPrep();
    if(!loadFor(view)) return fail();
    $("#msg").remove(); $("#gapLbl").textContent=" "+GAPS[gap][0]; $("#hspLbl").textContent=" "+HSP[hsp][0]; showSpd(); showCd(); if(XU){ $("#rep").hidden=false; showRep(); } setupInk("ink:fit:"+(vk||(lid?"l:"+lid:"")||xid||src||title)); setView(view); showBar(); barSpace(); wake();
  }catch(e){ fail(); }
}
</script>
<script src="vault.js"></script>
<script src="lib/verovio-toolkit-wasm.js"></script>
<script>verovio.module.onRuntimeInitialized=start;</script>
</body>
