<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#111111">
<title>Score</title>
<link rel="icon" href="../icon.svg" type="image/svg+xml">
<style>
:root{--bg:#141414;--bar:rgba(20,20,20,.9);--fg:#f2efe8;--muted:#a8a29a;--accent:#c9a46a;--paper:#fffdf8}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--paper);color:var(--fg);font:15px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-user-select:none;user-select:none}
#app{position:fixed;top:0;left:0;width:100vw;height:100vh;height:100dvh;overflow:hidden;transform-origin:0 0;background:var(--paper)}
#scroller{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;touch-action:pan-y}
body.pages #scroller{overflow:hidden}
#score{background:var(--paper);min-height:100%}
#score svg{display:block;width:100%;height:auto}
body.pages #score svg{width:100%;height:100%}
#score{touch-action:pan-y}
body.pages #score{touch-action:none}
body.pages #score{position:absolute;inset:0;overflow:hidden}
.zone{position:absolute;top:0;bottom:0;width:38%;z-index:2;cursor:pointer;display:none}
body.pages .zone{display:block}
#zl{left:0}#zr{right:0}
#bar{position:absolute;left:0;right:0;top:0;z-index:5;display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:8px 10px;padding-top:max(8px,env(safe-area-inset-top));background:var(--bar);backdrop-filter:blur(6px);transition:opacity .25s,transform .25s}
#bar.hide{opacity:0;transform:translateY(-100%);pointer-events:none}
#title{flex:1 1 140px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
button{font:inherit;color:var(--fg);background:#2a2a2a;border:1px solid #3a3a3a;border-radius:8px;padding:6px 10px;cursor:pointer;min-height:38px;min-width:38px}
button[aria-pressed="true"]{background:var(--accent);color:#1a1a1a;border-color:var(--accent)}
button:disabled{opacity:.4}
.seg{display:inline-flex}.seg button{border-radius:0}.seg button:first-child{border-radius:8px 0 0 8px}.seg button:last-child{border-radius:0 8px 8px 0}
#pg{min-width:52px;text-align:center;color:var(--muted)}
body:not(.pages) .ponly{display:none}
#msg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;color:#555;z-index:1;background:var(--paper)}
#msg a{color:#8a6a2a}
#menuBtn{position:absolute;right:max(14px,env(safe-area-inset-right));top:max(14px,env(safe-area-inset-top));z-index:4;width:44px;height:44px;min-width:44px;padding:0;border-radius:12px;border:0;background:rgba(40,40,40,.72);color:#fff;font-size:20px;line-height:44px;backdrop-filter:blur(6px)}
@media (max-width:520px){.lbl{display:none}}
</style>
</head>
<body class="pages">
<div id="app">
<div id="msg">Loading the score…</div>
<div id="scroller"><div id="score"></div></div>
<div class="zone" id="zl" aria-hidden="true"></div>
<div class="zone" id="zr" aria-hidden="true"></div>
<div id="bar">
  <a href="./" style="text-decoration:none"><button type="button" title="Back to the library">←</button></a>
  <div id="title">Score</div>
  <div class="seg" role="group" aria-label="Layout">
    <button type="button" data-view="pages" title="Turn pages (tap or pedal)">Pages</button>
    <button type="button" data-view="scroll" title="One long scrolling page">Scroll</button>
  </div>
  <div class="seg" role="group" aria-label="Size">
    <button type="button" id="zout" title="Smaller (−)">A−</button>
    <button type="button" id="zin" title="Bigger (+)">A+</button>
    <button type="button" id="all" title="Shrink until the whole score fits on one screen">Fit all</button>
  </div>
  <button type="button" id="gap" title="Space between lines (G)">↕<span class="lbl" id="gapLbl"> Normal</span></button>
  <button type="button" id="hsp" title="Space between notes (H)">↔<span class="lbl" id="hspLbl"> Normal</span></button>
  <button type="button" id="prev" class="ponly" title="Previous (← / Page Up)">‹</button>
  <span id="pg" class="ponly">–</span>
  <button type="button" id="next" class="ponly" title="Next (→ / Page Down / space)">›</button>
  <div class="seg" role="group" aria-label="Auto-scroll">
    <button type="button" id="play" title="Scroll down by itself (P)">▶<span class="lbl"> Play</span></button>
    <button type="button" id="slow" title="Slower">−</button>
    <span id="spd" style="padding:0 8px;color:var(--muted);align-self:center">1</span>
    <button type="button" id="fast" title="Faster">+</button>
  </div>
  <button type="button" id="rot" title="Rotate the score (R) — for a monitor standing upright that doesn't rotate by itself">⟳<span class="lbl" id="rotLbl"> Upright</span></button>
  <button type="button" id="fs" title="Full screen (F)">⛶<span class="lbl"> Full screen</span></button>
</div>
<button type="button" id="menuBtn" title="Menu" aria-label="Show menu">☰</button>
</div>

<script>
const API_KEY="AIzaSyBBSNHHAweVUTKnF_R7UlKpH9bhgyLypIo";
const $=s=>document.querySelector(s);
const P=new URLSearchParams(location.search);
const xid=P.get("x"), src=P.get("src"), title=P.get("t")||"Score", pdf=P.get("id");
document.title=title; $("#title").textContent=title;
let tk=null, page=1, pages=1, view=localStorage.getItem("fit-view")||"pages";
let zoom=+(localStorage.getItem("fit-zoom")||0);
const GAPS=[["Normal",8,30],["Compact",3,12],["Tight",0,4]];   // name, verovio spacingSystem, page margins
let gap=+(localStorage.getItem("fit-gap")||0)%GAPS.length;
const HSP=[["Normal",0.25,0.6],["Compact",0.17,0.5],["Tight",0.11,0.42]];   // name, spacingLinear, spacingNonLinear (lower = long notes take less room)
let hsp=+(localStorage.getItem("fit-hsp")||0)%HSP.length;   // user offset from the automatic size
const ROTS=[[0,"Upright"],[90,"Turned ↻"],[270,"Turned ↺"]];
let rot=+(localStorage.getItem("fit-rot")||0)%ROTS.length;
const SW=()=>Math.round(window.visualViewport?visualViewport.width:innerWidth), SH=()=>Math.round(window.visualViewport?visualViewport.height:innerHeight);
const VW=()=>ROTS[rot][0]?SH():SW(), VH=()=>ROTS[rot][0]?SW():SH();
function applyRot(){ const a=$("#app"), d=ROTS[rot][0];
  a.style.width=VW()+"px"; a.style.height=VH()+"px";
  a.style.transform=d===90?`translateX(${SW()}px) rotate(90deg)`:d===270?`translateY(${SH()}px) rotate(-90deg)`:"none";
  $("#rotLbl").textContent=" "+ROTS[rot][1]; }
function setRot(r){ rot=r%ROTS.length; try{localStorage.setItem("fit-rot",rot)}catch(e){} applyRot(); layout(true); }
/* auto-scroll */
const SPEEDS=[6,9,13,18,24,32,42,55,72,95];   // pixels per second
let spd=+(localStorage.getItem("fit-spd")||3), playing=false, lastT=0, acc=0;
function showSpd(){ $("#spd").textContent=spd+1; }
function tick(t){ if(!playing) return; const sc=$("#scroller");
  if(lastT){ acc+=SPEEDS[spd]*(t-lastT)/1000; const n=Math.floor(acc); if(n){ sc.scrollTop+=n; acc-=n; } }
  lastT=t;
  if(sc.scrollTop+sc.clientHeight>=sc.scrollHeight-1){ stopPlay(); return; }
  requestAnimationFrame(tick); }
function startPlay(){ if(!tk) return; if(view!=="scroll") setView("scroll"); playing=true; lastT=0; acc=0; $("#play").innerHTML='❚❚<span class="lbl"> Pause</span>'; $("#play").setAttribute("aria-pressed","true"); $("#bar").classList.add("hide"); requestAnimationFrame(tick); }
function stopPlay(){ playing=false; $("#play").innerHTML='▶<span class="lbl"> Play</span>'; $("#play").setAttribute("aria-pressed","false"); }
function setSpd(v){ spd=Math.max(0,Math.min(SPEEDS.length-1,v)); try{localStorage.setItem("fit-spd",spd)}catch(e){} showSpd(); }
function autoScale(){ return Math.round(Math.max(24,Math.min(60,VW()/14,VH()/12))); }
function scale(){ return Math.max(18,Math.min(90,autoScale()+zoom)); }
function layout(keepRatio){
  if(!tk) return; applyRot();
  const ratio=pages>1?(page-1)/(pages-1):0, s=scale(), k=100/s;
  const opts={scale:s,pageWidth:Math.round(VW()*k),pageMarginLeft:40,pageMarginRight:40,pageMarginTop:view==="pages"?Math.max(GAPS[gap][2],20)+20:GAPS[gap][2],pageMarginBottom:GAPS[gap][2],
    breaks:"auto",footer:"none",header:"auto",spacingSystem:GAPS[gap][1],spacingLinear:HSP[hsp][1],spacingNonLinear:HSP[hsp][2],spacingStaff:4,svgViewBox:true,svgRemoveXlink:true};
  if(view==="pages"){ opts.pageHeight=Math.round(VH()*k); opts.adjustPageHeight=false; }
  else { opts.pageHeight=60000; opts.adjustPageHeight=true; }
  tk.setOptions(opts); tk.redoLayout();
  pages=tk.getPageCount();
  page=keepRatio?Math.max(1,Math.min(pages,1+Math.round(ratio*(pages-1)))):Math.min(page,pages);
  draw();
}
function draw(){
  if(view==="pages"){ $("#score").innerHTML=tk.renderToSVG(page); $("#pg").textContent=page+" / "+pages; $("#prev").disabled=page<=1; $("#next").disabled=page>=pages; }
  else { let h=""; for(let i=1;i<=pages;i++) h+=tk.renderToSVG(i); $("#score").innerHTML=h; }
}
function go(d){ if(view!=="pages"||!tk) return; const n=page+d; if(n<1||n>pages) return; page=n; draw(); }
function setView(v){ view=v; try{localStorage.setItem("fit-view",v)}catch(e){} document.body.classList.toggle("pages",v==="pages");
  document.querySelectorAll("[data-view]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.view===v)); page=1; layout(false); $("#scroller").scrollTop=0; }
function setGap(g){ gap=g%GAPS.length; try{localStorage.setItem("fit-gap",gap)}catch(e){} $("#gapLbl").textContent=" "+GAPS[gap][0]; $("#gap").title="Space between lines: "+GAPS[gap][0]+" (G)"; layout(true); }
$("#gap").onclick=()=>setGap(gap+1);
function setHsp(h){ hsp=h%HSP.length; try{localStorage.setItem("fit-hsp",hsp)}catch(e){} $("#hspLbl").textContent=" "+HSP[hsp][0]; $("#hsp").title="Space between notes: "+HSP[hsp][0]+" (H)"; layout(true); }
$("#hsp").onclick=()=>setHsp(hsp+1);
$("#rot").onclick=()=>setRot(rot+1);
$("#play").onclick=()=>playing?stopPlay():startPlay(); $("#slow").onclick=()=>setSpd(spd-1); $("#fast").onclick=()=>setSpd(spd+1);
function fitAll(){ // biggest size at which the whole piece fits one screen
  if(!tk) return; if(view!=="pages") setView("pages");
  for(let z=zoom; scale()>18; z-=2){ zoom=z; layout(false); if(pages===1) break; }
  try{localStorage.setItem("fit-zoom",zoom)}catch(e){}
}
$("#all").onclick=fitAll;
function setZoom(d){ zoom+=d; try{localStorage.setItem("fit-zoom",zoom)}catch(e){} layout(true); }
document.querySelectorAll("[data-view]").forEach(b=>b.addEventListener("click",()=>setView(b.dataset.view)));
$("#zin").onclick=()=>setZoom(+4); $("#zout").onclick=()=>setZoom(-4);
$("#prev").onclick=()=>go(-1); $("#next").onclick=()=>go(1);
$("#zl").onclick=()=>go(-1); $("#zr").onclick=()=>go(1);
let hideT; function showBar(){ $("#bar").classList.remove("hide"); clearTimeout(hideT); hideT=setTimeout(()=>$("#bar").classList.add("hide"),4000); }
$("#menuBtn").onclick=showBar; $("#score").addEventListener("click",()=>{ if(playing){ stopPlay(); showBar(); return; } ($("#bar").classList.contains("hide")?showBar():$("#bar").classList.add("hide")); });
$("#bar").addEventListener("pointerdown",showBar);
addEventListener("keydown",e=>{
  const k=e.key;
  if(view==="pages"){
    if(["ArrowRight","PageDown"," ","ArrowDown","Enter"].includes(k)){e.preventDefault();go(1);return}
    if(["ArrowLeft","PageUp","ArrowUp","Backspace"].includes(k)){e.preventDefault();go(-1);return}
  } else if(k==="PageDown"||k===" "){ e.preventDefault(); $("#scroller").scrollBy({top:VH()*0.85,behavior:"smooth"}); return; }
  else if(k==="PageUp"){ e.preventDefault(); $("#scroller").scrollBy({top:-VH()*0.85,behavior:"smooth"}); return; }
  if(k==="+"||k==="=") setZoom(4); else if(k==="-") setZoom(-4); else if(k==="f"||k==="F") toggleFs(); else if(k==="g"||k==="G") setGap(gap+1); else if(k==="h"||k==="H") setHsp(hsp+1); else if(k==="r"||k==="R") setRot(rot+1); else if(k==="p"||k==="P") playing?stopPlay():startPlay();
});
const along=t=>{ const d=ROTS[rot][0]; return d===90?t.clientY:d===270?-t.clientY:t.clientX; };
let sx=null; addEventListener("touchstart",e=>{ sx=e.touches.length===1?along(e.touches[0]):null; },{passive:true});
addEventListener("touchend",e=>{ if(sx===null) return; const dx=along(e.changedTouches[0])-sx; sx=null; if(Math.abs(dx)>60) go(dx<0?1:-1); },{passive:true});
let rT, lastW=innerWidth, lastH=innerHeight;
addEventListener("resize",()=>{ clearTimeout(rT); rT=setTimeout(()=>{ if(Math.abs(innerWidth-lastW)<4&&Math.abs(innerHeight-lastH)<60&&view==="scroll") return; lastW=innerWidth; lastH=innerHeight; layout(true); },200); });
async function toggleFs(){ const el=document.documentElement; try{ if(!document.fullscreenElement) await (el.requestFullscreen||el.webkitRequestFullscreen).call(el); else await document.exitFullscreen(); }catch(e){} }
$("#fs").onclick=toggleFs;
function relayoutSoon(){ [60,300,800].forEach(t=>setTimeout(()=>{ lastW=innerWidth; lastH=innerHeight; layout(true); },t)); }
document.addEventListener("fullscreenchange",relayoutSoon); document.addEventListener("webkitfullscreenchange",relayoutSoon);
if(window.visualViewport) visualViewport.addEventListener("resize",()=>{ clearTimeout(rT); rT=setTimeout(()=>layout(true),250); });
/* pinch = A- / A+ (instead of browser zoom, which on iPad also exits full screen) */
let pinch0=null;
addEventListener("touchstart",e=>{ if(e.touches.length===2){ const [a,b]=e.touches; pinch0=Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY); } },{passive:true});
addEventListener("touchmove",e=>{ if(e.touches.length>=2) e.preventDefault(); },{passive:false});
addEventListener("touchend",e=>{ if(pinch0&&e.touches.length<2){ const t=e.changedTouches[0], o=e.touches[0]; pinch0=null; } },{passive:true});
let lastPinch=1;
addEventListener("touchmove",e=>{ if(pinch0&&e.touches.length===2){ const [a,b]=e.touches; lastPinch=Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY)/pinch0; } },{passive:true});
addEventListener("touchend",e=>{ if(e.touches.length===0&&lastPinch!==1){ const r=lastPinch; lastPinch=1; if(r>1.12) setZoom(Math.min(16,Math.round((r-1)*12))); else if(r<0.88) setZoom(-Math.min(16,Math.round((1-r)*12))); } },{passive:true});
["gesturestart","gesturechange","gestureend"].forEach(n=>document.addEventListener(n,e=>e.preventDefault(),{passive:false}));
let lock=null; async function wake(){ try{ lock=await navigator.wakeLock.request("screen"); }catch(e){} }
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible") wake(); });

function fail(){ $("#msg").innerHTML="This score couldn't be shown here."+(pdf?`<br><br><a href="view.html?id=${encodeURIComponent(pdf)}&t=${encodeURIComponent(title)}">Open the PDF instead</a>`:""); }
applyRot();
async function start(){
  const url=src||(xid?`https://www.googleapis.com/drive/v3/files/${encodeURIComponent(xid)}?alt=media&key=${API_KEY}`:null);
  if(!url){ $("#msg").textContent="No score selected."; return; }
  let xml; try{ const r=await fetch(url); if(!r.ok) throw 0; xml=await r.text(); }catch(e){ return fail(); }
  try{
    tk=new verovio.toolkit();
    tk.setOptions({scale:scale(),breaks:"auto"});
    xml=xml.replace(/<credit[\s\S]*?<\/credit>/g,"").replace(/<page-layout>[\s\S]*?<\/page-layout>/g,"").replace(/<system-layout>[\s\S]*?<\/system-layout>/g,"").replace(/<staff-layout[\s\S]*?<\/staff-layout>/g,"").replace(/<print[^>]*\/>/g,"").replace(/<print[\s\S]*?<\/print>/g,"");
    if(!tk.loadData(xml)) return fail();
    $("#msg").remove(); $("#gapLbl").textContent=" "+GAPS[gap][0]; $("#hspLbl").textContent=" "+HSP[hsp][0]; showSpd(); setView(view); showBar(); wake();
  }catch(e){ fail(); }
}
</script>
<script src="lib/verovio-toolkit-wasm.js"></script>
<script>verovio.module.onRuntimeInitialized=start;</script>
</body>
</html>
