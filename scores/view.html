<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#111111">
<title>Score viewer</title>
<link rel="icon" href="../icon.svg" type="image/svg+xml">
<style>
:root{--bg:#141414;--bar:rgba(20,20,20,.86);--fg:#f2efe8;--muted:#a8a29a;--accent:#c9a46a;--paper:#fff}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font:15px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden;-webkit-user-select:none;user-select:none}
#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;gap:6px;padding:6px;touch-action:pan-y pinch-zoom}
#stage canvas{background:var(--paper);box-shadow:0 2px 14px rgba(0,0,0,.45);max-width:100%;max-height:100%}
#hint{max-width:calc(100% - 24px);text-align:center}
.zone{position:fixed;top:0;bottom:0;width:38%;z-index:2;cursor:pointer}
#zl{left:0}#zr{right:0}
#bar{position:fixed;left:0;right:0;top:0;z-index:5;display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:8px 10px;padding-top:max(8px,env(safe-area-inset-top));background:var(--bar);backdrop-filter:blur(6px);transition:opacity .25s,transform .25s}
#bar.hide{opacity:0;transform:translateY(-100%);pointer-events:none}
#title{flex:1 1 160px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
#title small{color:var(--muted);font-weight:400;margin-left:8px}
button,select{font:inherit;color:var(--fg);background:#2a2a2a;border:1px solid #3a3a3a;border-radius:8px;padding:6px 10px;cursor:pointer;min-height:36px}
button[aria-pressed="true"]{background:var(--accent);color:#1a1a1a;border-color:var(--accent)}
.seg{display:inline-flex}.seg button{border-radius:0}.seg button:first-child{border-radius:8px 0 0 8px}.seg button:last-child{border-radius:0 8px 8px 0}
#pg{min-width:64px;text-align:center;color:var(--muted)}
#msg{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;color:var(--muted);z-index:1}
#msg a{color:var(--accent)}
#hint{position:fixed;bottom:max(10px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:var(--bar);color:var(--muted);padding:6px 12px;border-radius:999px;font-size:13px;z-index:4;transition:opacity .4s}
@media (max-width:560px){#title small{display:none}.lbl{display:none}}
</style>
</head>
<body>
<div id="msg">Loading…</div>
<div id="stage" aria-live="polite"></div>
<div class="zone" id="zl" aria-hidden="true"></div>
<div class="zone" id="zr" aria-hidden="true"></div>
<div id="bar">
  <a href="./" style="text-decoration:none"><button type="button" title="Back to the library">←</button></a>
  <div id="title">Score<small></small></div>
  <div class="seg" role="group" aria-label="Pages on screen">
    <button type="button" data-mode="auto" title="One page upright, two pages sideways">Auto</button>
    <button type="button" data-mode="1" title="One page">1<span class="lbl"> page</span></button>
    <button type="button" data-mode="2" title="Two pages side by side">2<span class="lbl"> pages</span></button>
  </div>
  <button type="button" id="prev" title="Previous (← / Page Up)">‹</button>
  <span id="pg">–</span>
  <button type="button" id="next" title="Next (→ / Page Down / space)">›</button>
  <button type="button" id="fs" title="Full screen (F)">⛶<span class="lbl"> Full screen</span></button>
</div>
<div id="hint">Tap left / right to turn · tap the middle for the menu · works with page-turner pedals</div>

<script src="vault.js"></script>
<script src="lib/pdf.min.js"></script>
<script>if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});</script>
<script>
/* Google API key, restricted to this website and to the Drive API (read-only, public files). */
const API_KEY="AIzaSyBBSNHHAweVUTKnF_R7UlKpH9bhgyLypIo";
pdfjsLib.GlobalWorkerOptions.workerSrc="lib/pdf.worker.min.js";
const $=s=>document.querySelector(s);
const P=new URLSearchParams(location.search);
const id=P.get("id"), src=P.get("src"), title=P.get("t")||"Score", who=P.get("a")||"";
document.title=title+" — score";
$("#title").firstChild.textContent=title; $("#title small").textContent=who;
let doc=null, first=1, mode=localStorage.getItem("sv-mode")||"auto", busy=false, again=false;

function perView(){ if(mode==="1") return 1; if(mode==="2") return 2; return innerWidth>innerHeight*1.05?2:1; }
function clamp(){ const n=perView(); if(!doc) return; if(first>doc.numPages) first=doc.numPages; if(first<1) first=1;
  if(n===2 && first===doc.numPages && first>1 && doc.numPages%2===0) first--; }
async function render(){
  if(!doc) return; if(busy){again=true;return} busy=true;
  clamp(); const n=Math.min(perView(),doc.numPages-first+1), st=$("#stage");
  const W=innerWidth-12-(n-1)*6, H=innerHeight-12, dpr=Math.min(window.devicePixelRatio||1,3);
  const pages=await Promise.all([...Array(n)].map((_,k)=>doc.getPage(first+k)));
  const base=pages[0].getViewport({scale:1});
  const scale=Math.min(W/n/base.width,H/base.height);
  const cs=[];
  for(const pg of pages){
    const vp=pg.getViewport({scale:scale*dpr}); const c=document.createElement("canvas");
    c.width=Math.floor(vp.width); c.height=Math.floor(vp.height);
    c.style.width=Math.floor(vp.width/dpr)+"px"; c.style.height=Math.floor(vp.height/dpr)+"px";
    await pg.render({canvasContext:c.getContext("2d"),viewport:vp}).promise; cs.push(c);
  }
  st.replaceChildren(...cs);
  const last=first+n-1; $("#pg").textContent=(n>1?first+"–"+last:first)+" / "+doc.numPages;
  $("#prev").disabled=first<=1; $("#next").disabled=last>=doc.numPages;
  busy=false; if(again){again=false;render();}
}
function go(d){ if(!doc) return; const n=perView(); const nf=first+d*n; if(nf<1||nf>doc.numPages) return; first=nf; render(); }
function setMode(m){ mode=m; try{localStorage.setItem("sv-mode",m)}catch(e){} document.querySelectorAll("[data-mode]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.mode===m)); render(); }
document.querySelectorAll("[data-mode]").forEach(b=>b.addEventListener("click",()=>setMode(b.dataset.mode)));
$("#prev").onclick=()=>go(-1); $("#next").onclick=()=>go(1);
$("#zl").onclick=()=>go(-1); $("#zr").onclick=()=>go(1);
let hideT; function showBar(){ $("#bar").classList.remove("hide"); clearTimeout(hideT); hideT=setTimeout(()=>$("#bar").classList.add("hide"),4000); }
$("#stage").addEventListener("click",()=>{ $("#bar").classList.contains("hide")?showBar():$("#bar").classList.add("hide"); });
$("#bar").addEventListener("pointerdown",showBar);
addEventListener("keydown",e=>{
  const k=e.key;
  if(["ArrowRight","PageDown"," ","ArrowDown","Enter"].includes(k)){e.preventDefault();go(1)}
  else if(["ArrowLeft","PageUp","ArrowUp","Backspace"].includes(k)){e.preventDefault();go(-1)}
  else if(k==="f"||k==="F") toggleFs();
  else if(k==="Home"){first=1;render()} else if(k==="End"&&doc){first=doc.numPages;render()}
});
let sx=null; addEventListener("touchstart",e=>{ if(e.touches.length===1) sx=e.touches[0].clientX; },{passive:true});
addEventListener("touchend",e=>{ if(sx===null) return; const dx=e.changedTouches[0].clientX-sx; sx=null; if(Math.abs(dx)>60) go(dx<0?1:-1); },{passive:true});
let rT; addEventListener("resize",()=>{clearTimeout(rT); rT=setTimeout(render,150)});
async function toggleFs(){
  const el=document.documentElement;
  try{ if(!document.fullscreenElement){ await (el.requestFullscreen||el.webkitRequestFullscreen).call(el); } else { await document.exitFullscreen(); } }catch(e){}
}
$("#fs").onclick=toggleFs;
/* keep the screen awake while a score is open */
let lock=null; async function wake(){ try{ lock=await navigator.wakeLock.request("screen"); }catch(e){} }
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible"){ wake(); if(doc){ busy=false; render(); } } });

async function load(){
  let url;
  if(src) url=src;
  else if(id && API_KEY) url=`https://www.googleapis.com/drive/v3/files/${encodeURIComponent(id)}?alt=media&key=${API_KEY}`;
  else if(id){ $("#msg").innerHTML=`The viewer isn't connected to Google Drive yet.<br><br><a href="https://drive.google.com/file/d/${encodeURIComponent(id)}/view">Open the score in Google Drive</a>`; return; }
  else { $("#msg").textContent="No score selected."; return; }
  try{
    doc=await pdfjsLib.getDocument({url,disableRange:true,disableStream:true}).promise;
    $("#msg").textContent=""; setMode(mode); showBar(); wake();
    setTimeout(()=>$("#hint").style.opacity=0,5000);
  }catch(e){
    $("#msg").innerHTML=`This score couldn't be loaded here.<br><br>`+(id?`<a href="https://drive.google.com/file/d/${encodeURIComponent(id)}/view">Open it in Google Drive</a>`:"");
  }
}
(async()=>{ if(window.Vault && !(await Vault.user())){ $("#msg").innerHTML='This score is locked.<br><br><a href="./">Sign in on the library page</a>'; return; } load(); })();
</script>
</body>
</html>
